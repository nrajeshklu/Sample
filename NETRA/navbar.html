<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETRA - Mission Control</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">

        <!-- Left Section: Logo and Branding -->
        <div class="brand-section">
            <div class="logo">N</div>
            <h1 class="brand-name">NETRA</h1>
        </div>

        <!-- Middle Section: Title and Subtitle -->
        <div class="title-section">
            <h2>– Mission Control</h2>
            <p>Smart Rover Fleet. Intelligent Campus.</p>
        </div>

        <!-- Right Section: Status and Button -->
        <div class="right-section">

            <div class="status">
                <span class="status-dot"></span>
                <span>Live - Simulated Telemetry</span>
            </div>

            <button class="dispatch-btn">
                Dispatch Mission
            </button>
        </div>
    </header>
    
<main class="page">
    <section class="kpi-grid">
        <article class="kpi-card">
            <span>ROVERS ONLINE</span>
            <h2 id="online-count">6 / 6</h2>
            <p>Active rover units</p>
        </article>
        <article class="kpi-card">
            <span>AVERAGE BATTERY</span>
            <h2 id="battery-level">85%</h2>
            <p>Overall battery status</p>
        </article>
        <article class="kpi-card">
            <span>OPEN ALERTS</span>
            <h2 id="open-alerts">0</h2>
            <p>Active alerts and warnings</p>
        </article>
        <article class="kpi-card">
            <span>DISTANCE TRAVELED</span>
            <h2 id="distance">12.5 km</h2>
            <p>Total distance covered</p>
        </article>
    </section>


    <!-- three more cards, same shape -->
    </section>
</main>

</body>
</html>
